<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web Clone</title>
    <style>
        :root {
            --tg-theme-bg: #0e1621;
            --tg-theme-sidebar: #17212b;
            --tg-theme-active: #2b5278;
            --tg-theme-text: #f5f5f5;
            --tg-theme-hint: #7f91a4;
            --tg-theme-button: #2481cc;
            --tg-theme-border: #101924;
            --star-color: #ffa800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--tg-theme-bg);
            color: var(--tg-theme-text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Экран авторизации */
        #auth-screen {
            background: var(--tg-theme-sidebar);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 500;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            background: var(--tg-theme-bg);
            border: 1px solid var(--tg-theme-border);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--tg-theme-button);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Главный интерфейс */
        #main-app {
            display: none;
            width: 100%;
            height: 100vh;
        }

        /* Боковая панель */
        .sidebar {
            width: 320px;
            background: var(--tg-theme-sidebar);
            border-right: 1px solid var(--tg-theme-border);
            display: flex;
            flex-direction: column;
        }

        .profile-widget {
            padding: 20px;
            border-bottom: 1px solid var(--tg-theme-border);
            background: rgba(0,0,0,0.1);
        }

        .user-email {
            font-size: 14px;
            color: var(--tg-theme-hint);
            margin-bottom: 8px;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .balance-container {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .star-icon {
            color: var(--star-color);
            margin-right: 6px;
            font-size: 20px;
        }

        .nav-tabs {
            display: flex;
            border-bottom: 1px solid var(--tg-theme-border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border-radius: 0;
            padding: 15px;
            font-size: 14px;
            font-weight: 500;
            color: var(--tg-theme-hint);
        }

        .tab-btn.active {
            color: #fff;
            border-bottom: 2px solid var(--tg-theme-button);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* Основная рабочая область */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--tg-theme-bg);
            position: relative;
        }

        /* Сетка подарков и донатов */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding: 10px;
        }

        .card {
            background: var(--tg-theme-sidebar);
            border: 1px solid var(--tg-theme-border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .card-price {
            font-size: 13px;
            color: var(--star-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-btn {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        .donate-btn {
            background: #31b545;
        }

        /* Заглушка чата */
        .chat-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--tg-theme-hint);
        }

        /* Модальные уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2b5278;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transform: translateY(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- ЭКРАН РЕГИСТРАЦИИ / ВХОДА -->
    <div id="auth-screen">
        <div class="logo">✈️</div>
        <h2>Вход в Telegram</h2>
        <p style="color: var(--tg-theme-hint); font-size: 14px; margin-bottom: 15px;">
            Введите ваш Email. Новым пользователям начисляется бонус <b>1 000 Звёзд</b>!
        </p>
        <input type="email" id="email-input" placeholder="Ваша электронная почта" required>
        <button onclick="login()">Продолжить</button>
    </div>

    <!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="main-app">
        <!-- Левая колонка -->
        <div class="sidebar">
            <div class="profile-widget">
                <div class="user-email" id="user-display">user@mail.com</div>
                <div class="balance-container">
                    <span class="star-icon">⭐</span>
                    <span id="balance-count">1000</span>
                </div>
            </div>
            
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('gifts')">Подарки</button>
                <button class="tab-btn" onclick="switchTab('stars')">Звёзды (Донат)</button>
            </div>

            <!-- Контент вкладок панели -->
            <div class="sidebar-content" id="sidebar-list">
                <!-- Контент генерируется через JS -->
            </div>
        </div>

        <!-- Правая колонка (Окно чата) -->
        <div class="main-content">
            <div class="chat-placeholder">
                <span style="font-size: 50px; margin-bottom: 10px;">💬</span>
                <p>Выберите чат или отправьте подарок из панели слева</p>
            </div>
        </div>
    </div>

    <!-- Уведомления -->
    <div id="toast" class="toast">Уведомление</div>

    <script>
        // Инициализация базы данных приложения в памяти
        let userBalance = 1000;
        let userEmail = "";

        // Данные реальных подарков (эквивалент в звездах и их ценность)
        const giftsData = [
            { id: 1, name: "Лягушонок", icon: "🐸", price: 50 },
            { id: 2, name: "Красная роза", icon: "🌹", price: 100 },
            { id: 3, name: "Бриллиант", icon: "💎", price: 250 },
            { id: 4, name: "Праздничный торт", icon: "🎂", price: 500 },
            { id: 5, name: "Сердце в огне", icon: "❤️‍🔥", price: 750 },
            { id: 6, name: "Золотой Кубок", icon: "🏆", price: 1000 },
            { id: 7, name: "Корона лидера", icon: "👑", price: 2500 },
            { id: 8, name: "Ракета Илона", icon: "🚀", price: 5000 }
        ];

        // Фейковые тарифы покупки звезд (примерные реальные ценники из Telegram)
        const starsPacks = [
            { id: 1, count: 50, priceRub: "149 ₽" },
            { id: 2, count: 250, priceRub: "699 ₽" },
            { id: 3, count: 1000, priceRub: "2490 ₽" },
            { id: 4, count: 2500, priceRub: "5990 ₽" },
            { id: 5, count: 5000, priceRub: "11990 ₽" }
        ];

        // Логика авторизации
        function login() {
            const emailInput = document.getElementById('email-input').value;
            if (!emailInput || !emailInput.includes('@')) {
                showToast("Пожалуйста, введите корректный Email!");
                return;
            }
            userEmail = emailInput;
            document.getElementById('user-display').innerText = userEmail;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            
            showToast("Вы успешно зарегистрировались! Начислено 1000 ⭐");
            updateBalanceDisplay();
            switchTab('gifts'); // Открываем вкладку подарков по умолчанию
        }

        // Обновление баланса на экране
        function updateBalanceDisplay() {document.getElementById('balance-count').innerText = userBalance.toLocaleString();
}
// Переключение вкладок в боковом меню
function switchTab(tabName) {
const tabs = document.querySelectorAll('.tab-btn');
tabs.forEach(tab => tab.classList.remove('active'));
const event = window.event;
if(event) event.target.classList.add('active');
const container = document.getElementById('sidebar-list');
container.innerHTML = "";
const grid = document.createElement('div');
grid.className = 'grid-container';
if (tabName === 'gifts') {
giftsData.forEach(gift => {
grid.innerHTML += <div class="card"> <div class="card-icon">${gift.icon}</div> <div class="card-title">${gift.name}</div> <div class="card-price">⭐ ${gift.price}</div> <button class="card-btn" onclick="buyGift(${gift.price}, '${gift.name}')">Купить</button> </div>;
});
} else if (tabName === 'stars') {
starsPacks.forEach(pack => {
grid.innerHTML += <div class="card"> <div class="card-icon" style="color: var(--star-color)">⭐</div> <div class="card-title">+${pack.count} Звёзд</div> <div class="card-price" style="color: #31b545">${pack.priceRub}</div> <button class="card-btn donate-btn" onclick="fakeDonate(${pack.count}, '${pack.priceRub}')">Пополнить</button> </div>;
});
}
container.appendChild(grid);
}
// Логика покупки подарка
function buyGift(price, name) {
if (userBalance >= price) {
userBalance -= price;
updateBalanceDisplay();
showToast(Вы успешно приобрели подарок: ${name}!);
} else {
showToast("Недостаточно Звёзд! Пополните баланс во вкладке Донат.");
}
}
// Логика симуляции доната (Фейк покупка)
function fakeDonate(count, priceRub) {
// Имитация успешного платежного шлюза
userBalance += count;
updateBalanceDisplay();
showToast(Фейк-оплата на ${priceRub} прошла успешно! Добавлено ${count} ⭐);
}
// Всплывающие уведомления
function showToast(text) {
const toast = document.getElementById('toast');
toast.innerText = text;
toast.classList.add('show');
setTimeout(() => {
toast.classList.remove('show');
}, 3000);
}
