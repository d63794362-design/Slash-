<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер Слэш</title>
    <!-- Подключаем официальную библиотеку Supabase напрямую -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0e1621; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #17212b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #5288c1; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #24303f; color: #fff; }
        button { background: #40a7e3; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #3597d4; }
        .btn-stars { background: #f1c40f; color: #000; }
        .btn-premium { background: #9b59b6; }
        .status { color: #2ecc71; font-weight: bold; margin-top: 10px; text-align: center; }
        .error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Мессенджер СЛЭШ 💬</h1>

    <!-- БЛОК РЕГИСТРАЦИИ -->
    <div class="card" id="auth-block">
        <h2>Регистрация (1000 ⭐️ в подарок)</h2>
        <input type="text" id="username" placeholder="Придумайте Username (например, alex)">
        <input type="email" id="email" placeholder="Введите ваш Email">
        <button onclick="registerUser()">Зарегистрироваться в Слэш</button>
        <div id="auth-status" class="status"></div>
    </div>

    <!-- ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ -->
    <div class="card" id="profile-block" style="display:none;">
        <h2>Ваш Профиль</h2>
        <p>Привет, <span id="user-display-name" style="color:#40a7e3; font-weight:bold;"></span>!</p>
        <p>Баланс: <span id="stars-display" style="color:#f1c40f; font-weight:bold;">1000</span> ⭐️</p>
        <p>Закрепленный номер: <span id="phone-display" style="color:#2ecc71; font-weight:bold;">Не куплен</span></p>
        <p>Статус: <span id="premium-display">Обычный</span></p>
        
        <button class="btn-stars" onclick="fakeBuyStars()">💫 Фейк Донат (+5000 Звёзд)</button>
        <button onclick="buyAnonymousNumber()">📞 Купить номер +888 (Цена: 999 ⭐️)</button>
        <button class="btn-premium" onclick="buyPremiumStatus()">💎 Купить Слэш Premium (Цена: 500 ⭐️)</button>
        <div id="profile-status" class="status"></div>
    </div>

    <script>
        // Инициализация Supabase облака (твои данные уже вшиты!)
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_secret_XoZvaVOlAvg4-76cJSYwsQ_7xNfPs1f"; // Твой секретный ключ
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        // ФУНКЦИЯ РЕГИСТРАЦИИ С ПРОВЕРКОЙ ДУБЛИКАТОВ
        async function registerUser() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const statusDiv = document.getElementById('auth-status');

            if(!username || !email) {
                statusDiv.className = "error";
                statusDiv.innerText = "Заполните все поля!";
                return;
            }

            // 1. Проверяем в облаке, заняты ли username или email
            const { data: checkUser } = await supabase.from('users').select('id').or(`username.eq.${username},email.eq.${email}`).maybeSingle();
            
            if (checkUser) {
                statusDiv.className = "error";
                statusDiv.innerText = "Этот Username или Email уже зарегистрированы!";
                return;
            }

            // 2. Создаем пользователя в базе (1000 звезд закрепляется автоматически)
            const { data: newUser, error } = await supabase.from('users').insert([{ username, email, stars_balance: 1000 }]).select().single();

            if(error) {
                statusDiv.className = "error";
                statusDiv.innerText = "Ошибка: " + error.message;
            } else {
                currentUser = newUser;
                statusDiv.className = "status";
                statusDiv.innerText = "Успешная регистрация!";
                loadProfile();
            }
        }

        // ЗАГРУЗКА ИНТЕРФЕЙСА ПРОФИЛЯ
        function loadProfile() {
            document.getElementById('auth-block').style.display = 'none';
            document.getElementById('profile-block').style.display = 'block';
            document.getElementById('user-display-name').innerText = "@" + currentUser.username;
            document.getElementById('stars-display').innerText = currentUser.stars_balance;
            document.getElementById('phone-display').innerText = currentUser.phone ? currentUser.phone : "Не куплен";
            document.getElementById('premium-display').innerHTML = currentUser.is_premium ? "<span style='color:#9b59b6; font-weight:bold;'>⭐ Слэш Premium</span>" : "Обычный";
        }

        // ФЕЙК НАКРУТКА ЗВЕЗД
        async function fakeBuyStars() {
            const newBalance = currentUser.stars_balance + 5000;
            const { data: updated } = await supabase.from('users').update({ stars_balance: newBalance }).eq('id', currentUser.id).select().single();
            currentUser = updated;
            loadProfile();
            document.getElementById('profile-status').innerText = "Начислено 5000 звёзд бесплатно!";
        }

        // ПОКУПКА УНИКАЛЬНОГО НОМЕРА +888 ЧЕРЕЗ ОБЛАКО (Закрепляется за юзером навсегда)
        async function buyAnonymousNumber() {
            const statusDiv = document.getElementById('profile-status');
            
            if(currentUser.phone) {
                statusDiv.className = "error";
                statusDiv.innerText = "За вами уже закреплен номер: " + currentUser.phone;
                return;
            }
            if(currentUser.stars_balance < 999) {
                statusDiv.className = "error";
                statusDiv.innerText = "Недостаточно звёзд! Сделайте фейк-донат.";
                return;
            }

            let isUnique = false;
            let generatedNumber = '';

            // Бесконечная проверка в облаке базы данных, чтобы номера ни у кого не повторялись
            while (!isUnique) {
                generatedNumber = `+888${Math.floor(10000000 + Math.random() * 90000000)}`;
                const { data } = await supabase.from('users').select('id').eq('phone', generatedNumber).maybeSingle();
                if (!data) isUnique = true; 
            }

            // Списываем звезды и привязываем номер к пользователю в облаке
            const newBalance = currentUser.stars_balance - 999;
            const { data: updated } = await supabase.from('users').update({ stars_balance: newBalance, phone: generatedNumber }).eq('id', currentUser.id).select().single();
            
            currentUser = updated;
            loadProfile();
            statusDiv.className = "status";
            statusDiv.innerText = "Успешно куплен и закреплен номер " + generatedNumber;
        }

        // ПОКУПКА PREMIUM ЗА ЗВЕЗДЫ
        async function buyPremiumStatus() {
            const statusDiv = document.getElementById('profile-status');
            if(currentUser.is_premium) {
                statusDiv.innerText = "У вас уже есть Premium статус!";
                return;
            }
            if(currentUser.stars_balance < 500) {
                statusDiv.className = "error";
                statusDiv.innerText = "Недостаточно звёзд!";
                return;
            }

            const newBalance = currentUser.stars_balance - 500;
            const { data: updated } = await supabase.from('users').update({ stars_balance: newBalance, is_premium: true }).eq('id', currentUser.id).select().single();
            
            currentUser = updated;
            loadProfile();
            statusDiv.className = "status";
            statusDiv.innerText = "Premium статус успешно активирован!";
        }
    </script>
</body>
</html>
